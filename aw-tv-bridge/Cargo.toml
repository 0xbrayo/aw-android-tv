[package]
name = "aw-tv-bridge"
version = "0.1.0"
edition = "2021"
description = "Bridges aw-android-tv SSE stream to a central ActivityWatch server"

[[bin]]
name = "aw-tv-bridge"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
eventsource-client = "0.13"
mdns-sd = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
tokio-retry = "0.3"
dirs = "5"
